  <style>/* ACT Design Tokens, University palette, restrained light use */
:root {
  /* Palette */
  --c-white: #FFFFFF;
  --c-bg: #F8EFE0;              /* cooler paper, away from warm cream */
  --c-bg-2: #EDEAE0;             /* section break, softer limestone */
  --c-bg-3: #E6E2D4;
  --c-ink: #140F50;              /* dark blue, only for emphasis */
  --c-ink-2: #2A2560;            /* body headings */
  --c-body: #3E3A6B;             /* body text */
  --c-muted: #6B6790;            /* captions, meta */
  --c-hairline: #E5DFC9;         /* divider on limestone */
  --c-hairline-2: #D9D2B8;
  --c-bright: #5B3DF5;           /* CTA, active, tool violet */
  --c-purple: #836BFF;           /* secondary data */
  --c-red: #D31569;
  --c-red-2: #EF3E8C;
  --c-bright-soft: rgba(91, 61, 245, 0.08);
  --c-purple-soft: rgba(131, 107, 255, 0.12);

  /* Type */
  --f-display: Georgia, "Times New Roman", "Times", serif;
  --f-sans: "Mulish", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, monospace;

  /* Scale */
  --fs-xs: 12px;
  --fs-sm: 13px;
  --fs-base: 15px;
  --fs-md: 17px;
  --fs-lg: 20px;
  --fs-xl: 28px;
  --fs-2xl: 40px;
  --fs-3xl: 56px;
  --fs-4xl: 84px;
  --fs-5xl: 128px;

  /* Spacing */
  --sp-1: 4px;
  --sp-2: 8px;
  --sp-3: 12px;
  --sp-4: 16px;
  --sp-5: 24px;
  --sp-6: 32px;
  --sp-7: 48px;
  --sp-8: 64px;
  --sp-9: 96px;
  --sp-10: 128px;

  --radius-sm: 4px;
  --radius: 8px;
  --radius-lg: 14px;

  --maxw: 1280px;
  --gutter: 48px;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--f-sans);
  font-size: var(--fs-base);
  line-height: 1.55;
  color: var(--c-body);
  background: var(--c-bg);
  font-feature-settings: "ss01", "cv11";
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
a { color: inherit; text-decoration: none; }
button { font-family: inherit; }

h1, h2, h3, h4 {
  font-family: var(--f-display);
  color: var(--c-ink);
  font-weight: 400;
  letter-spacing: -0.01em;
  line-height: 1.05;
  margin: 0;
}
.mono { font-family: var(--f-mono); font-feature-settings: "ss01"; }

/* Reusable */
.eyebrow {
  font-family: var(--f-mono);
  font-size: 11px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--c-muted);
  font-weight: 500;
}
.container {
  max-width: var(--maxw);
  margin: 0 auto;
  padding: 0 var(--gutter);
}
.hairline { height: 1px; background: var(--c-hairline); border: 0; margin: 0; }

/* Buttons */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 12px 20px;
  border-radius: 999px;
  font-family: var(--f-sans);
  font-size: 14px;
  font-weight: 500;
  letter-spacing: -0.005em;
  border: 1px solid transparent;
  cursor: pointer;
  transition: transform 180ms ease, background 180ms ease, color 180ms ease, border-color 180ms ease;
  text-decoration: none;
  white-space: nowrap;
}
.btn-primary {
  background: var(--c-ink);
  color: var(--c-bg-2);
  border-color: var(--c-ink);
}
.btn-primary:hover { transform: translateY(-1px); background: #0a0640; }
.btn-ghost {
  background: transparent;
  color: var(--c-ink);
  border-color: var(--c-hairline-2);
}
.btn-ghost:hover { background: rgba(20,15,80,0.04); border-color: var(--c-ink); }
.btn .arrow { transition: transform 240ms ease; }
.btn:hover .arrow { transform: translateX(3px); }

/* Replay button for demos */
.replay-btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 10px;
  font-family: var(--f-mono);
  font-size: 11px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--c-muted);
  background: transparent;
  border: 1px solid var(--c-hairline-2);
  border-radius: 999px;
  cursor: pointer;
  transition: all 160ms ease;
}
.replay-btn:hover { color: var(--c-ink); border-color: var(--c-ink); }
.replay-btn svg { transition: transform 400ms ease; }
.replay-btn:hover svg { transform: rotate(-180deg); }

/* Focus */
:focus-visible { outline: 2px solid var(--c-bright); outline-offset: 2px; }

/* Scroll feel */
html { scroll-behavior: smooth; }
</style>
  <style>/* ACT, Shell styles (nav, footer, scroll-demo chrome) */

/* ─── Nav ─── */
.site-nav {
  position: sticky;
  top: 0;
  z-index: 50;
  background: rgba(244, 242, 234, 0.72);
  backdrop-filter: saturate(1.4) blur(14px);
  -webkit-backdrop-filter: saturate(1.4) blur(14px);
  transition: border-color 240ms ease, background 240ms ease;
  border-bottom: 1px solid transparent;
}
.site-nav.is-scrolled {
  background: rgba(244, 242, 234, 0.92);
  border-bottom-color: var(--c-hairline);
}
.site-nav-inner {
  display: flex;
  align-items: center;
  gap: 32px;
  padding: 14px var(--gutter);
}
.site-brand {
  display: flex; align-items: center; gap: 10px;
  color: var(--c-ink);
  flex-shrink: 0;
}
.brand-mark {
  display: flex;
  padding: 4px;
  border-radius: 8px;
}
.brand-mark img, .footer-mark img { transform: scaleX(-1); }
.brand-text { display: flex; flex-direction: column; line-height: 1; }
.brand-name {
  font-family: var(--f-display);
  font-size: 22px;
  color: var(--c-ink);
  letter-spacing: 0.01em;
}
.brand-sub {
  font-family: var(--f-mono);
  font-size: 10px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--c-muted);
  margin-top: 2px;
}
.site-links {
  display: flex;
  gap: 2px;
  margin-left: auto;
  margin-right: 12px;
}
.site-link {
  padding: 8px 14px;
  font-size: 14px;
  color: var(--c-body);
  border-radius: 6px;
  transition: color 160ms, background 160ms;
  letter-spacing: -0.005em;
  white-space: nowrap;
}
.site-link:hover { color: var(--c-ink); background: rgba(20,15,80,0.04); }
.site-link.is-current { color: var(--c-ink); }
.site-link.is-current::after {
  content: '';
  display: block;
  height: 1px;
  background: var(--c-ink);
  margin: 2px 2px 0;
}

/* ─── Footer ─── */
.site-footer {
  margin-top: var(--sp-6);
  padding: 20px 0;
  background: var(--c-bg-2);
  border-top: 1px solid var(--c-hairline);
}
.footer-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
  flex-wrap: wrap;
}
.footer-brand { display: flex; align-items: center; gap: 14px; }
.footer-brand .footer-mark { margin-bottom: 0; }
.footer-brand-text { display: flex; flex-direction: column; gap: 2px; }
.footer-title {
  font-family: var(--f-display);
  font-size: 15px;
  color: var(--c-ink);
  line-height: 1.2;
}
.footer-note {
  font-size: 12px;
  color: var(--c-muted);
  line-height: 1.3;
  max-width: none;
}
.footer-bottom {
  padding-top: 0;
  border-top: 0;
  display: flex;
  gap: 20px;
  color: var(--c-muted);
  font-size: 11px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}

/* ─── ScrollDemo chrome ─── */
.scroll-demo {
  position: relative;
  background: var(--c-white);
  border: 1px solid var(--c-hairline);
  border-radius: var(--radius-lg);
  overflow: hidden;
  box-shadow: 0 1px 0 rgba(20,15,80,0.03), 0 20px 40px -24px rgba(20,15,80,0.15);
}
.scroll-demo-stage {
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 10;
  overflow: hidden;
  background: var(--c-white);
}
.scroll-demo-strip {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 12px 16px;
  border-top: 1px solid var(--c-hairline);
  background: var(--c-bg);
}
.demo-label {
  display: flex; align-items: center; gap: 8px;
  flex-shrink: 0;
}
.demo-dot {
  width: 8px; height: 8px;
  border-radius: 999px;
  transition: background 240ms;
}
.demo-label-text {
  font-size: 11px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--c-muted);
}
.demo-caption {
  flex: 1;
  font-size: 13px;
  color: var(--c-body);
  line-height: 1.4;
}
.scroll-demo-progress {
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: transparent;
  z-index: 2;
  pointer-events: none;
}
.scroll-demo-progress-fill {
  height: 100%;
  background: var(--c-bright);
  transition: width 60ms linear;
}

@media (max-width: 1200px) {
  .site-links { gap: 0; }
  .site-link { padding: 8px 10px; font-size: 13px; }
  .brand-sub { display: none; }
}
@media (max-width: 1180px) {
  .site-links { display: none; }
}
@media (max-width: 900px) {
  .footer-grid { grid-template-columns: 1fr 1fr; }
  :root { --gutter: 24px; }
}
@media (max-width: 620px) {
  .site-cta { display: none; }
}

/* ─── Nav CTA (two pathway buttons) ─── */
.site-cta { display: flex; gap: 6px; flex-shrink: 0; }
.btn-nav-a { font-size: 13px; padding: 10px 14px; background: var(--c-red); border-color: var(--c-red); color: var(--c-white, #fff); }
.btn-nav-a:hover { background: #A80F52; border-color: #A80F52; transform: translateY(-1px); }
.btn-nav-b {
  font-size: 13px;
  padding: 10px 14px;
  background: var(--c-red-2);
  border-color: var(--c-red-2);
  color: var(--c-white, #fff);
}
.btn-nav-b:hover { background: var(--c-red); border-color: var(--c-red); transform: translateY(-1px); }
</style>
  <style>/* ACT landing page sections styles */

/* ─── Common section heads ─── */
.section-head {
  max-width: 760px;
  margin-bottom: 56px;
}
.section-head .eyebrow { margin-bottom: 20px; }
.section-title {
  font-size: 52px;
  letter-spacing: -0.02em;
  line-height: 1.03;
  margin-bottom: 20px;
  text-wrap: balance;
}
.section-title em {
  font-family: var(--f-display);
  font-style: italic;
  color: var(--c-ink);
}
.section-lede {
  font-size: 19px;
  color: var(--c-body);
  line-height: 1.5;
  max-width: 640px;
  text-wrap: pretty;
}

/* ─── Hero ─── */
.hero {
  padding: 72px 0 96px;
}
.hero-name-row {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 32px;
}
.hero-pill {
  display: inline-flex;
  align-items: center;
  padding: 5px 11px;
  background: var(--c-ink);
  color: var(--c-bg);
  border-radius: 999px;
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.18em;
}
.hero-name-row .eyebrow { margin: 0; }
.hero-sub {
  font-family: var(--f-display);
  font-style: italic;
  font-size: 26px;
  line-height: 1.25;
  color: var(--c-ink);
  margin: 24px 0 20px;
  max-width: 560px;
  text-wrap: balance;
  opacity: 0.85;
}
.hero-lede strong {
  color: var(--c-ink);
  font-weight: 500;
}
.hero-inner {
  display: grid;
  grid-template-columns: 1fr 1.15fr;
  gap: 80px;
  align-items: center;
}
.hero-left .eyebrow { margin: 0; }
.hero-title {
  font-family: var(--f-display);
  font-weight: 700;
  font-size: 68px;
  line-height: 1.0;
  letter-spacing: -0.025em;
  margin-bottom: 0;
  text-wrap: balance;
}
.cat-letter {
  color: var(--c-purple);
  font-style: normal;
}
.hero-lede {
  font-size: 19px;
  line-height: 1.55;
  color: var(--c-body);
  max-width: 520px;
  margin-bottom: 40px;
  text-wrap: pretty;
}
.hero-ctas {
  display: flex; gap: 12px;
  margin-bottom: 48px;
}
.hero-meta {
  display: flex;
  gap: 40px;
  padding-top: 28px;
  border-top: 1px solid var(--c-hairline);
}
.hero-meta > div {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.hero-meta .mono {
  font-size: 15px;
  color: var(--c-ink);
  letter-spacing: -0.01em;
}
.hero-meta span:last-child {
  font-size: 12px;
  color: var(--c-muted);
  letter-spacing: 0.02em;
}
.hero-right { position: relative; }

/* ─── Question band ─── */
.qband {
  padding: 80px 0;
  background: var(--c-bg-2);
  border-top: 1px solid var(--c-hairline);
  border-bottom: 1px solid var(--c-hairline);
}
.qband-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 80px;
  align-items: start;
}
.qband-title {
  font-size: 44px;
  line-height: 1.08;
  letter-spacing: -0.02em;
  margin-top: 16px;
  text-wrap: balance;
}
.qband-body {
  display: flex;
  flex-direction: column;
  gap: 20px;
  font-size: 17px;
  color: var(--c-body);
  line-height: 1.6;
  text-wrap: pretty;
}

/* ─── Pathways ─── */
.pathways {
  padding: 128px 0 96px;
}
.pathway-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 24px;
}
.pathway-card {
  display: flex;
  flex-direction: column;
  gap: 20px;
  padding: 40px 40px 40px 40px;
  border-radius: 18px;
  border: 1px solid var(--c-hairline);
  background: var(--c-white);
  transition: transform 240ms ease, border-color 240ms ease, box-shadow 240ms ease, opacity 240ms ease;
  color: inherit;
  position: relative;
  overflow: hidden;
  min-height: 380px;
  cursor: pointer;
}
.pathway-stream-mark {
  display: flex;
  align-items: baseline;
  gap: 10px;
  padding-bottom: 20px;
  border-bottom: 1px solid var(--c-hairline);
  margin-bottom: 4px;
}
.pathway-stream-label {
  font-size: 11px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--c-muted);
  position: relative;
  top: -14px;
}
.pathway-stream-letter {
  font-family: var(--f-display);
  font-size: 80px;
  line-height: 1;
  letter-spacing: -0.04em;
  color: var(--c-bright);
  font-style: italic;
}
.pathway-card.is-b .pathway-stream-letter { color: var(--c-purple); }
.pathway-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 6px;
  background: var(--c-bright);
  transform: scaleX(1);
  transform-origin: left;
  transition: height 240ms ease;
}
.pathway-card.is-b::before { background: var(--c-purple); }
.pathway-card.is-hover { border-color: var(--c-ink); transform: translateY(-4px); box-shadow: 0 20px 60px -30px rgba(20,15,80,0.25); }
.pathway-card.is-hover::before { height: 10px; }
.pathway-card.is-dim { opacity: 0.55; }
.pathway-tag {
  font-size: 11px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--c-muted);
}
.pathway-title {
  font-size: 34px;
  line-height: 1.1;
  letter-spacing: -0.015em;
  text-wrap: balance;
}
.pathway-arrow {
  display: inline-block;
  color: var(--c-bright);
  font-family: var(--f-mono);
  font-style: normal;
  font-weight: 400;
  margin: 0 2px;
  transition: transform 240ms ease;
}
.pathway-card.is-b .pathway-arrow { color: var(--c-purple); }
.pathway-card.is-hover .pathway-arrow { transform: translateX(4px); }
.pathway-desc {
  font-size: 16px;
  color: var(--c-body);
  line-height: 1.5;
}
.pathway-list {
  list-style: none;
  padding: 16px 0;
  margin: 0;
  border-top: 1px dashed var(--c-hairline);
  border-bottom: 1px dashed var(--c-hairline);
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.pathway-list li {
  display: grid;
  grid-template-columns: 64px 1fr;
  gap: 12px;
  align-items: baseline;
  font-size: 14px;
  color: var(--c-body);
}
.pathway-list .mono {
  font-size: 10px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--c-muted);
}
.pathway-foot {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: auto;
}
.pathway-cta {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 14px;
  color: var(--c-ink);
  font-weight: 500;
}
.pathway-guide {
  font-size: 12px;
  color: var(--c-muted);
  border-bottom: 1px solid var(--c-hairline-2);
  padding-bottom: 2px;
  transition: color 160ms, border-color 160ms;
}
.pathway-guide:hover { color: var(--c-ink); border-color: var(--c-ink); }
.pathway-note {
  margin-top: 32px;
  padding: 16px 24px;
  background: var(--c-bg-2);
  border-left: 3px solid var(--c-hairline-2);
  font-size: 14px;
  color: var(--c-body);
  border-radius: 0 8px 8px 0;
}
.pathway-note .mono {
  letter-spacing: 0.06em;
  color: var(--c-ink);
  margin-right: 4px;
}

/* ─── How it works (demos section) ─── */
.how {
  padding: 96px 0;
  background: var(--c-bg-2);
  border-top: 1px solid var(--c-hairline);
  border-bottom: 1px solid var(--c-hairline);
}
.how-demos {
  display: flex;
  flex-direction: column;
  gap: 96px;
}
.how-demo-block {
  display: grid;
  grid-template-columns: 340px 1fr;
  gap: 48px;
  align-items: center;
}
.how-demo-block.is-reversed {
  grid-template-columns: 1fr 340px;
}
.how-demo-block.is-reversed .how-demo-head { order: 2; }
.how-demo-head {
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.how-demo-tag {
  font-size: 11px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--c-muted);
}
.how-demo-title {
  font-size: 34px;
  line-height: 1.1;
  letter-spacing: -0.015em;
  text-wrap: balance;
}
.how-demo-note {
  font-size: 15px;
  color: var(--c-body);
  line-height: 1.55;
  text-wrap: pretty;
}

/* ─── Use cases ─── */
.cases { padding: 128px 0 96px; }
.cases-grid {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 24px;
}
.case-card {
  display: flex;
  flex-direction: column;
  gap: 16px;
  padding: 32px;
  background: var(--c-bg-2);
  border-radius: 14px;
  border: 1px solid var(--c-hairline);
  min-height: 240px;
  transition: transform 240ms ease, border-color 240ms ease;
}
.case-card:hover { transform: translateY(-3px); border-color: var(--c-hairline-2); }
.case-tag {
  font-size: 11px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--c-bright);
}
.case-title {
  font-size: 24px;
  line-height: 1.15;
  text-wrap: balance;
}
.case-body {
  font-size: 15px;
  color: var(--c-body);
  line-height: 1.55;
  text-wrap: pretty;
}
.cases-modes { margin-top: 64px; }
.modes-divider { height: 1px; background: var(--c-hairline); margin-bottom: 48px; }
.modes-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 64px;
}
.modes-grid > div {
  display: flex; flex-direction: column; gap: 12px;
}
.modes-grid p {
  font-size: 16px;
  line-height: 1.6;
  color: var(--c-body);
  margin: 0;
  text-wrap: pretty;
}

/* ─── Emphasis quote ─── */
.emphasis {
  padding: 120px 0;
  background: var(--c-ink);
  color: var(--c-bg-2);
}
.emphasis-quote {

    .gexample-note { font-size: 13px; color: var(--c-body); line-height: 1.5; margin-bottom: 12px; text-wrap: pretty; }

    .ttabs {
      display: flex; flex-wrap: wrap; row-gap: 10px; gap: 20px;
      border-bottom: 1px solid var(--c-hairline-2);
    }
    .ttab {
      flex-shrink: 0; padding: 16px 2px; background: none; border: 0;
      border-bottom: 2px solid transparent; margin-bottom: -1px;
      cursor: pointer; font-family: var(--f-sans); font-size: 14px;
      color: var(--c-muted); transition: color 140ms;
      display: flex; align-items: baseline; gap: 7px;
    }
    .ttab:hover { color: var(--c-ink); }
    .ttab .ttab-n { font-family: var(--f-mono); font-size: 11px; color: inherit; }
    .ttab.is-active { color: var(--c-ink); font-weight: 700; border-bottom-color: var(--c-ink); }
    .twindow {
      margin-top: 24px; background: var(--c-white);
      border: 1px solid var(--c-hairline); border-top: 3px solid var(--c-bright);
      border-radius: 4px 4px 14px 14px; padding: 36px 40px;
    }
    .twindow-title {
      font-family: var(--f-display); font-weight: 700; font-size: 24px;
      color: var(--c-ink); margin: 0 0 18px;
    }
    .tinstr {
      padding: 16px 20px; background: var(--c-bright-soft); border: 1px solid transparent;
      border-radius: 10px; font-size: 13.5px; line-height: 1.6; color: var(--c-body);
      margin-bottom: 20px;
    }
    .tinstr strong { color: var(--c-ink); font-weight: 600; }
    .tinstr p { margin: 0; }
    .gcallout a { color: var(--c-bright); text-decoration: underline; text-underline-offset: 2px; }
    .gcallout a:hover { color: var(--c-ink); }

    .gcta {
      margin-top: 56px; padding: 36px 40px;
      background: var(--c-ink); border-radius: 16px;
      display: flex; justify-content: space-between; align-items: center; gap: 24px;
    }
    .gcta h3 {
      font-family: var(--f-display); font-size: 24px; color: var(--c-bg-2);
      letter-spacing: -0.01em; line-height: 1.15; margin: 0 0 6px;
    }
    .gcta-meta { font-size: 13px; color: rgba(248,239,224,0.65); }
    .gcta .btn { flex-shrink: 0; background: var(--c-purple); color: var(--c-white); border-color: var(--c-purple); }
    .gcta .btn:hover { background: #6a52dd; border-color: #6a52dd; }

    @media (max-width: 900px) {
      .guide-layout { grid-template-columns: 1fr; padding: 24px 24px 64px; }
      .gtoc { position: static; flex-direction: row; flex-wrap: wrap; gap: 4px; }
      .gtoc a { border-left: 0; border-bottom: 2px solid transparent; }
      .gtoc a.is-active { border-left: 0; border-bottom-color: var(--c-purple); }
      .gh-title { font-size: 32px; }
    }
  </style>

  <script type="text/babel">

  function ExcelPreview() {
    const [open, setOpen] = React.useState(false);
    return (
      <div style={{ margin: '14px 0', border: '1px solid var(--c-hairline)', borderRadius: 10, overflow: 'hidden' }}>
        <button
          onClick={() => setOpen(!open)}
          style={{
            display: 'flex', alignItems: 'center', justifyContent: 'space-between',
            width: '100%', padding: '12px 16px',
            background: 'var(--c-bg-2)', border: 0, cursor: 'pointer',
            fontFamily: 'var(--f-sans)', fontSize: 13, color: 'var(--c-ink)',
            textAlign: 'left', gap: 12,
          }}>
          <span>
            <span style={{ fontFamily: 'var(--f-mono)', fontSize: 10, letterSpacing: '0.1em', textTransform: 'uppercase', color: 'var(--c-muted)', marginRight: 12 }}>Preview</span>
            What the exported file looks like · click to expand
          </span>
          <svg style={{ flexShrink: 0, transform: open ? 'rotate(180deg)' : 'none', transition: 'transform 180ms' }} width="14" height="14" viewBox="0 0 14 14" fill="none">
            <path d="M3 5.5l4 4 4-4" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>
          </svg>
        </button>
        {open && (
          <div style={{ padding: '0 0 0 0' }}>
            <img src={window.__shots.sbex} alt="Pathway B CSV export: Assignments to Learning Outcomes with CLO Contribution Results and Notes" style={{ display: 'block', width: '100%' }} />
          </div>
        )}
      </div>
    );
  }

  // ── Explore-first card with a live-measured curved arrow pointing at the matching nav pill ──
  function HeroExploreCard({ href, navSelector, color, colorSoft, label }) {
    const cardRef = React.useRef(null);
    const wrapRef = React.useRef(null);
    const [geo, setGeo] = React.useState(null);
    const [drawn, setDrawn] = React.useState(false);

    React.useLayoutEffect(() => {
      function measure() {
        const navEl = document.querySelector(navSelector);
        const cardEl = cardRef.current;
        const wrapEl = wrapRef.current;
        if (!navEl || !cardEl || !wrapEl) return;
        const navRect = navEl.getBoundingClientRect();
        const cardRect = cardEl.getBoundingClientRect();
        const wrapRect = wrapEl.getBoundingClientRect();
        const ox = wrapRect.left, oy = wrapRect.top;
        const start = { x: cardRect.left - ox + cardRect.width * 0.5, y: cardRect.top - oy - 4 };
        const end = { x: navRect.left - ox + navRect.width / 2, y: navRect.top - oy + navRect.height + 8 };
        const dx = end.x - start.x, dy = end.y - start.y;
        const len = Math.hypot(dx, dy) || 1;
        const nx = -dy / len, ny = dx / len;
        const bend = Math.min(50, len * 0.22);
        const ctrl = { x: (start.x + end.x) / 2 + nx * bend, y: (start.y + end.y) / 2 + ny * bend };
        const path = `M ${start.x} ${start.y} Q ${ctrl.x} ${ctrl.y} ${end.x} ${end.y}`;
        const angle = Math.atan2(end.y - ctrl.y, end.x - ctrl.x) * 180 / Math.PI;
        setGeo({ path, len: len * 1.2, headX: end.x, headY: end.y, angle });
        setDrawn(false);
        requestAnimationFrame(() => requestAnimationFrame(() => setDrawn(true)));
      }
      measure();
      window.addEventListener('resize', measure);
      return () => window.removeEventListener('resize', measure);
    }, [navSelector]);

    return (
      <div ref={wrapRef} style={{ position: 'relative' }}>
        {geo && (
          <svg width="1" height="1" style={{ position: 'absolute', top: 0, left: 0, overflow: 'visible', pointerEvents: 'none', zIndex: 60 }}>
            <path d={geo.path} stroke={color} strokeWidth="2" fill="none" strokeLinecap="round"
              style={{ strokeDasharray: geo.len, strokeDashoffset: drawn ? 0 : geo.len, transition: 'stroke-dashoffset 1s ease-out' }} />
            <g style={{ transform: `translate(${geo.headX}px, ${geo.headY}px) rotate(${geo.angle}deg)`, opacity: drawn ? 1 : 0, transition: 'opacity 0.25s ease-out 0.85s' }}>
              <path d="M-14 -8 L2 0 L-14 8 Z" fill={color} stroke="none" />
            </g>
          </svg>
        )}
        <div ref={cardRef} className="hero-explore-pulse" style={{ '--pulse-color': color, background: colorSoft, border: `1.5px solid ${color}`, borderRadius: 14, padding: '20px 22px', textAlign: 'center', maxWidth: 260, margin: '0 auto' }}>
          <p style={{ fontSize: 14, fontWeight: 600, color: '#EFEEF6', margin: '0 0 12px', lineHeight: 1.4 }}>We recommend you explore first. Come back to the guide if/when you need it.</p>
          <a href={href} target="_blank" rel="noopener" style={{ display: 'inline-flex', alignItems: 'center', gap: 6, color, fontWeight: 600, fontSize: 14 }}>
            {label}
            <svg width="13" height="13" viewBox="0 0 14 14" fill="none"><path d="M3 7h8m0 0L7.5 3.5M11 7l-3.5 3.5" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/></svg>
          </a>
        </div>
        <style>{`
          .hero-explore-pulse { animation: heroExplorePulse 2.6s ease-in-out 1.5s infinite; }
          @keyframes heroExplorePulse {
            0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 color-mix(in srgb, var(--pulse-color) 22%, transparent); }
            50% { transform: scale(1.025); box-shadow: 0 0 0 10px color-mix(in srgb, var(--pulse-color) 0%, transparent); }
          }
        `}</style>
      </div>
    );
  }

  function GuidePage() {
    return (
      <>
        <SiteNav current="stream-b" />
        <main>
          <section className="gh">
            <div className="gh-inner">
              <div className="gh-navy-col">
                <span className="gh-tag">Pathway B</span>
                <h1 className="gh-title">Assignments → Learning Outcomes</h1>
                <p style={{ fontSize: 15, color: 'rgba(255,255,255,0.82)', marginTop: 8, maxWidth: 560, lineHeight: 1.55 }}>Starts from your summative assignments and rubrics, and displays the CLO weightings that mapping actually delivers, best suited when you want to check what an existing rubric is really assessing, or you're refining rubric criteria and want to see the effect on CLO emphasis. <span style={{ color: '#EDEAE0', background: 'rgba(255,255,255,0.12)' }}>Note: the numbers the tool produces are estimates, rounding to the nearest 5% is fine.</span> The Teaching Readiness Mapping Template, which lets you plan readiness week by week, is currently available in Pathway A only; it is coming to Pathway B in a later iteration.</p>
              </div>
            </div>
          </section>

          <div style={{ maxWidth: 1400, padding: '40px 48px 80px 100px' }}>
            <PathwayContext pathway="B" />
            <PathwayBBuild />

          </div>
        </main>
        <SiteFooter />
      </>
    );
  }

  ReactDOM.createRoot(document.getElementById('app')).render(<GuidePage />);
  </script>

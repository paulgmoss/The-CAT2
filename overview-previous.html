  <style>/* ACT Design Tokens, University palette, restrained light use */
:root {
  /* Palette */
  --c-white: #FFFFFF;
  --c-bg: #F8EFE0;              /* cooler paper, away from warm cream */
  --c-bg-2: #EDEAE0;             /* section break, softer limestone */
  --c-bg-3: #E6E2D4;
  --c-ink: #140F50;              /* dark blue, only for emphasis */
  --c-ink-2: #2A2560;            /* body headings */
  --c-body: #3E3A6B;             /* body text */
  --c-muted: #6B6790;            /* captions, meta */
  --c-hairline: #E5DFC9;         /* divider on limestone */
  --c-hairline-2: #D9D2B8;
  --c-bright: #5B3DF5;           /* CTA, active, tool violet */
  --c-purple: #836BFF;           /* secondary data */
  --c-red: #D31569;              /* matches the CAT tool's own crimson accent */
  --c-red-soft: rgba(211, 21, 105, 0.24);
  --c-red-2: #EF3E8C;            /* brighter variant of the same crimson */
  --c-red-2-soft: rgba(239, 62, 140, 0.24);
  --c-bright-soft: rgba(91, 61, 245, 0.08);
  --c-purple-soft: rgba(131, 107, 255, 0.12);

  /* Type */
  --f-display: Georgia, "Times New Roman", "Times", serif;
  --f-sans: "Mulish", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, monospace;

  /* Scale */
  --fs-xs: 12px;
  --fs-sm: 13px;
  --fs-base: 15px;
  --fs-md: 17px;
  --fs-lg: 20px;
  --fs-xl: 28px;
  --fs-2xl: 40px;
  --fs-3xl: 56px;
  --fs-4xl: 84px;
  --fs-5xl: 128px;

  /* Spacing */
  --sp-1: 4px;
  --sp-2: 8px;
  --sp-3: 12px;
  --sp-4: 16px;
  --sp-5: 24px;
  --sp-6: 32px;
  --sp-7: 48px;
  --sp-8: 64px;
  --sp-9: 96px;
  --sp-10: 128px;

  --radius-sm: 4px;
  --radius: 8px;
  --radius-lg: 14px;

  --maxw: 1280px;
  --gutter: 48px;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--f-sans);
  font-size: var(--fs-base);
  line-height: 1.55;
  color: var(--c-body);
  background: var(--c-bg);
  font-feature-settings: "ss01", "cv11";
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
a { color: inherit; text-decoration: none; }
button { font-family: inherit; }

h1, h2, h3, h4 {
  font-family: var(--f-display);
  color: var(--c-ink);
  font-weight: 400;
  letter-spacing: -0.01em;
  line-height: 1.05;
  margin: 0;
}
.mono { font-family: var(--f-mono); font-feature-settings: "ss01"; }

/* Reusable */
.eyebrow {
  font-family: var(--f-mono);
  font-size: 11px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--c-muted);
  font-weight: 500;
}
.container {
  max-width: var(--maxw);
  margin: 0 auto;
  padding: 0 var(--gutter);
}
.hairline { height: 1px; background: var(--c-hairline); border: 0; margin: 0; }

/* Buttons */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 12px 20px;
  border-radius: 999px;
  font-family: var(--f-sans);
  font-size: 14px;
  font-weight: 500;
  letter-spacing: -0.005em;
  border: 1px solid transparent;
  cursor: pointer;
  transition: transform 180ms ease, background 180ms ease, color 180ms ease, border-color 180ms ease;
  text-decoration: none;
  white-space: nowrap;
}
.btn-primary {
  background: var(--c-ink);
  color: var(--c-bg-2);
  border-color: var(--c-ink);
}
.btn-primary:hover { transform: translateY(-1px); background: #0a0640; }
.btn-ghost {
  background: transparent;
  color: var(--c-ink);
  border-color: var(--c-hairline-2);
}
.btn-ghost:hover { background: rgba(20,15,80,0.04); border-color: var(--c-ink); }
.btn .arrow { transition: transform 240ms ease; }
.btn:hover .arrow { transform: translateX(3px); }

/* Replay button for demos */
.replay-btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 10px;
  font-family: var(--f-mono);
  font-size: 11px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--c-muted);
  background: transparent;
  border: 1px solid var(--c-hairline-2);
  border-radius: 999px;
  cursor: pointer;
  transition: all 160ms ease;
}
.replay-btn:hover { color: var(--c-ink); border-color: var(--c-ink); }
.replay-btn svg { transition: transform 400ms ease; }
.replay-btn:hover svg { transform: rotate(-180deg); }

/* Focus */
:focus-visible { outline: 2px solid var(--c-bright); outline-offset: 2px; }

/* Scroll feel */
html { scroll-behavior: smooth; }
</style>
  <style>/* ACT, Shell styles (nav, footer, scroll-demo chrome) */

/* ─── Nav ─── */
.site-nav {
  position: sticky;
  top: 0;
  z-index: 50;
  background: rgba(244, 242, 234, 0.72);
  backdrop-filter: saturate(1.4) blur(14px);
  -webkit-backdrop-filter: saturate(1.4) blur(14px);
  transition: border-color 240ms ease, background 240ms ease;
  border-bottom: 1px solid transparent;
}
.site-nav.is-scrolled {
  background: rgba(244, 242, 234, 0.92);
  border-bottom-color: var(--c-hairline);
}
.site-nav-inner {
  display: flex;
  align-items: center;
  gap: 32px;
  padding: 14px var(--gutter);
}
.site-brand {
  display: flex; align-items: center; gap: 10px;
  color: var(--c-ink);
  flex-shrink: 0;
}
.brand-mark {
  display: flex;
  padding: 4px;
  border-radius: 8px;
}
.brand-mark img, .footer-mark img { transform: scaleX(-1); }
.brand-text { display: flex; flex-direction: column; line-height: 1; }
.brand-name {
  font-family: var(--f-display);
  font-size: 22px;
  color: var(--c-ink);
  letter-spacing: 0.01em;
}
.brand-sub {
  font-family: var(--f-mono);
  font-size: 10px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--c-muted);
  margin-top: 2px;
}
.site-links {
  display: flex;
  gap: 2px;
  margin-left: auto;
  margin-right: 12px;
}
.site-link {
  padding: 8px 14px;
  font-size: 14px;
  color: var(--c-body);
  border-radius: 6px;
  transition: color 160ms, background 160ms;
  letter-spacing: -0.005em;
  white-space: nowrap;
}
.site-link:hover { color: var(--c-ink); background: rgba(20,15,80,0.04); }
.site-link.is-current { color: var(--c-ink); }
.site-link.is-current::after {
  content: '';
  display: block;
  height: 1px;
  background: var(--c-ink);
  margin: 2px 2px 0;
}

/* ─── Footer ─── */
.site-footer {
  margin-top: var(--sp-6);
  padding: 20px 0;
  background: var(--c-bg-2);
  border-top: 1px solid var(--c-hairline);
}
.footer-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
  flex-wrap: wrap;
}
.footer-brand { display: flex; align-items: center; gap: 14px; }
.footer-brand .footer-mark { margin-bottom: 0; }
.footer-brand-text { display: flex; flex-direction: column; gap: 2px; }
.footer-title {
  font-family: var(--f-display);
  font-size: 15px;
  color: var(--c-ink);
  line-height: 1.2;
}
.footer-note {
  font-size: 12px;
  color: var(--c-muted);
  line-height: 1.3;
  max-width: none;
}
.footer-col {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.footer-col .eyebrow { margin-bottom: 6px; }
.footer-col a {
  font-size: 14px;
  color: var(--c-body);
  transition: color 160ms;
}
.footer-col a:hover { color: var(--c-ink); }
.footer-meta {
  font-family: var(--f-mono);
  font-size: 11px;
  color: var(--c-muted);
  letter-spacing: 0.02em;
}
.footer-bottom {
  padding-top: 0;
  border-top: 0;
  display: flex;
  gap: 20px;
  color: var(--c-muted);
  font-size: 11px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}

/* ─── ScrollDemo chrome ─── */
.scroll-demo {
  position: relative;
  background: var(--c-white);
  border: 1px solid var(--c-hairline);
  border-radius: var(--radius-lg);
  overflow: hidden;
  box-shadow: 0 1px 0 rgba(20,15,80,0.03), 0 20px 40px -24px rgba(20,15,80,0.15);
}
.scroll-demo-stage {
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 10;
  overflow: hidden;
  background: var(--c-white);
}
.scroll-demo-strip {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 12px 16px;
  border-top: 1px solid var(--c-hairline);
  background: var(--c-bg);
}
.demo-label {
  display: flex; align-items: center; gap: 8px;
  flex-shrink: 0;
}
.demo-dot {
  width: 8px; height: 8px;
  border-radius: 999px;
  transition: background 240ms;
}
.demo-label-text {
  font-size: 11px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--c-muted);
}
.demo-caption {
  flex: 1;
  font-size: 13px;
  color: var(--c-body);
  line-height: 1.4;
}
.scroll-demo-progress {
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: transparent;
  z-index: 2;
  pointer-events: none;
}
.scroll-demo-progress-fill {
  height: 100%;
  background: var(--c-bright);
  transition: width 60ms linear;
}

@media (max-width: 1200px) {
  .site-links { gap: 0; }
  .site-link { padding: 8px 10px; font-size: 13px; }
  .brand-sub { display: none; }
}
@media (max-width: 1180px) {
  .site-links { display: none; }
}
@media (max-width: 900px) {
  .footer-grid { grid-template-columns: 1fr 1fr; }
  :root { --gutter: 24px; }
}
@media (max-width: 620px) {
  .site-cta { display: none; }
}

/* ─── Nav CTA (two pathway buttons) ─── */
.site-cta { display: flex; gap: 6px; flex-shrink: 0; }
.btn-nav-a {
  font-size: 13px;
  padding: 10px 14px;
  background: var(--c-red);
  border-color: var(--c-red);
  color: var(--c-white, #fff);
}
.btn-nav-a:hover { background: #A80F52; border-color: #A80F52; transform: translateY(-1px); }
.btn-nav-b {
  font-size: 13px;
  padding: 10px 14px;
  background: var(--c-red-2);
  border-color: var(--c-red-2);
  color: var(--c-white, #fff);
}
.btn-nav-b:hover { background: var(--c-red); border-color: var(--c-red); transform: translateY(-1px); }
</style>
  <style>/* Demo-specific styles */

.demo {
  position: absolute;
  inset: 0;
  padding: 32px 40px;
  display: flex;
  flex-direction: column;
  background: var(--c-white);
}
.eyebrow { display: block; }

/* ─── Hero Demo · four-view pipeline ─── */
.demo.hero-demo {
  padding: 18px 22px 14px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.hero-demo-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 16px;
}
.hero-demo-phase { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.hd-step { font-size: 11px; letter-spacing: 0.06em; color: var(--c-bright); flex-shrink: 0; }
.hd-step i { color: var(--c-hairline-2); font-style: normal; }
.hero-demo-phase b {
  font-family: var(--f-display);
  font-weight: 400;
  font-size: 16px;
  color: var(--c-ink);
  letter-spacing: -0.01em;
  line-height: 1.1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.hero-demo-legend {
  font-size: 10px;
  letter-spacing: 0.04em;
  color: var(--c-muted);
  flex-shrink: 0;
  white-space: nowrap;
}
.hero-pipeline {
  display: grid;
  grid-template-columns: 1fr 30px 0.92fr 30px 1fr 30px 1.18fr;
  align-items: stretch;
  flex: 1;
  min-height: 0;
}
.pipe-panel {
  display: flex;
  flex-direction: column;
  gap: 9px;
  min-width: 0;
  padding: 11px 12px;
  border: 1px solid var(--c-hairline);
  border-radius: 10px;
  background: var(--c-white);
  transition: opacity 220ms ease;
}
.pipe-panel-head {
  display: flex;
  align-items: baseline;
  gap: 6px;
  padding-bottom: 7px;
  border-bottom: 1px solid var(--c-hairline);
}
.pipe-num { font-size: 10px; color: var(--c-bright); letter-spacing: 0.06em; }
.pipe-title {
  font-size: 11.5px;
  color: var(--c-ink);
  letter-spacing: 0.01em;
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.pipe-kind {
  margin-left: auto;
  font-size: 8.5px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  padding: 2px 6px;
  border-radius: 999px;
  flex-shrink: 0;
}
.pipe-kind.is-input { color: var(--c-muted); background: var(--c-bg-2); }
.pipe-kind.is-derived { color: var(--c-bright); background: var(--c-bright-soft); }
.pipe-body { display: flex; flex-direction: column; gap: 9px; flex: 1; min-height: 0; justify-content: center; }
.pipe-connector { display: flex; align-items: center; justify-content: center; }

/* 01 CLO weightings */
.pw-row { display: grid; grid-template-columns: 38px 1fr 30px; align-items: center; gap: 8px; }
.pw-key { font-size: 10px; letter-spacing: 0.03em; }
.pw-track { height: 7px; background: var(--c-bg-2); border-radius: 4px; overflow: hidden; }
.pw-fill { height: 100%; border-radius: 4px; }
.pw-val { font-size: 10px; color: var(--c-muted); text-align: right; font-variant-numeric: tabular-nums; }

/* 02 mapping matrix */
.pm-grid { display: grid; grid-template-columns: 34px repeat(3, 1fr); gap: 3px; align-content: center; flex: 1; }
.pm-col { font-size: 10px; color: var(--c-ink); text-align: center; align-self: end; padding-bottom: 2px; }
.pm-rowkey { font-size: 9.5px; letter-spacing: 0.02em; display: flex; align-items: center; }
.pm-cell {
  min-height: 26px;
  display: flex; align-items: center; justify-content: center;
  border: 1px solid transparent;
  border-radius: 4px;
  font-size: 10px;
  font-variant-numeric: tabular-nums;
  color: var(--c-ink);
  transition: background 220ms ease, border-color 220ms ease;
}

/* 03 assignment weights */
.aw-row { display: flex; flex-direction: column; gap: 5px; }
.aw-head { display: flex; align-items: baseline; gap: 7px; }
.aw-id { font-size: 9.5px; color: var(--c-muted); letter-spacing: 0.04em; }
.aw-name { flex: 1; font-family: var(--f-display); font-size: 14px; color: var(--c-ink); }
.aw-val { font-family: var(--f-display); font-size: 19px; color: var(--c-ink); font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
.aw-bar { display: flex; height: 7px; border-radius: 4px; overflow: hidden; background: var(--c-bg-2); }

/* 04 rubric composition */
.rc-body { gap: 10px; }
.rc-block { display: flex; flex-direction: column; gap: 5px; }
.rc-head { font-size: 9.5px; color: var(--c-muted); letter-spacing: 0.03em; }
.rc-bar { display: flex; height: 16px; border-radius: 4px; overflow: hidden; background: var(--c-bg-2); }
.rc-seg { display: flex; align-items: center; justify-content: center; min-width: 0; transition: width 220ms ease; }
.rc-pct { font-family: var(--f-mono); font-size: 9px; color: rgba(255,255,255,0.92); font-variant-numeric: tabular-nums; }
.rc-legend { display: flex; flex-wrap: wrap; gap: 4px 12px; padding-top: 2px; }
.rc-leg { display: inline-flex; align-items: center; gap: 4px; font-size: 9px; color: var(--c-muted); letter-spacing: 0.03em; }
.rc-leg i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }

/* iteration / return loop */
.hero-loop {
  display: flex;
  align-items: center;
  gap: 12px;
  padding-top: 9px;
  border-top: 1px solid var(--c-hairline);
  transition: opacity 240ms ease;
}
.hero-loop-icon { display: flex; flex-shrink: 0; }
.hero-loop-track { position: relative; flex: 1; height: 0; border-top: 1.5px dashed var(--c-hairline-2); }
.hero-loop-dot { position: absolute; top: -3px; width: 6px; height: 6px; border-radius: 50%; background: var(--c-purple); transform: translateX(-50%); }
.hero-loop-label { font-size: 10px; letter-spacing: 0.04em; color: var(--c-purple); flex-shrink: 0; white-space: nowrap; }

/* legacy split-hero classes (kept harmless) */
.hero-demo-legacy { display: grid; grid-template-columns: 1fr 80px 1fr; gap: 24px; align-items: stretch; }
.demo-col {
  display: flex;
  flex-direction: column;
  gap: 14px;
  min-width: 0;
}
.demo-col-head {
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--c-hairline);
}
.demo-col-title {
  font-size: 13px;
  color: var(--c-ink);
  letter-spacing: 0.02em;
}
.clo-list, .assign-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.clo-row {
  display: grid;
  grid-template-columns: 48px 1fr 48px;
  align-items: center;
  gap: 10px;
  font-size: 12px;
  position: relative;
}
.clo-row.is-active .clo-key {
  font-weight: 600;
}
.clo-key { font-size: 11px; letter-spacing: 0.04em; }
.clo-bar-track {
  height: 8px;
  background: var(--c-bg-2);
  border-radius: 4px;
  overflow: visible;
  position: relative;
}
.clo-bar-fill {
  height: 100%;
  border-radius: 4px;
  transition: none;
}
.clo-handle {
  position: absolute;
  top: 50%;
  transform: translate(-50%, -50%);
  pointer-events: none;
}
.clo-handle-dot {
  width: 14px; height: 14px;
  border-radius: 50%;
  background: var(--c-white);
  border: 2px solid var(--c-ink);
  box-shadow: 0 2px 4px rgba(20,15,80,0.15);
}
.clo-handle-tooltip {
  position: absolute;
  bottom: 22px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--c-ink);
  color: var(--c-bg-2);
  padding: 3px 8px;
  border-radius: 4px;
  font-size: 10px;
  white-space: nowrap;
}
.clo-value {
  text-align: right;
  color: var(--c-muted);
  font-size: 11px;
  font-variant-numeric: tabular-nums;
}
.clo-sum {
  margin-top: auto;
  padding-top: 10px;
  border-top: 1px dashed var(--c-hairline);
  font-size: 11px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--c-muted);
  display: flex;
  justify-content: space-between;
}

.demo-flow svg {
  width: 100%;
  height: 100%;
}

.assign-card {
  display: flex; flex-direction: column; gap: 6px;
  padding: 10px 12px;
  background: var(--c-bg);
  border: 1px solid var(--c-hairline);
  border-radius: 8px;
  transition: opacity 200ms, transform 200ms;
}
.assign-row { display: flex; justify-content: space-between; font-size: 12px; }
.assign-name { color: var(--c-ink); }
.assign-weight { color: var(--c-ink); font-variant-numeric: tabular-nums; }
.assign-meter {
  display: flex;
  height: 6px;
  border-radius: 3px;
  overflow: hidden;
  background: var(--c-bg-2);
}

/* ─── Stream A / Stream B ─── */
.demo-step-label {
  font-size: 11px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--c-muted);
  margin-bottom: 20px;
}
.stream-grid, .streamb-grid {
  display: grid;
  grid-template-columns: 1fr 1.1fr;
  gap: 40px;
  flex: 1;
  min-height: 0;
}
.streamb-grid { gap: 28px; }
.stream-grid-3col {
  display: grid;
  grid-template-columns: 0.9fr 1.1fr 0.95fr;
  gap: 22px;
  flex: 1;
  min-height: 0;
  align-items: start;
}

/* Stream A (3-col) and Stream B (criteria-heavy) need more vertical space */
.scroll-demo:has(.stream-demo) .scroll-demo-stage { aspect-ratio: 16 / 10; }
.scroll-demo:has(.streamb-demo) .scroll-demo-stage { aspect-ratio: 16 / 11.5; }

    // Research tab), the section is rendered asynchronously after the bundle
    // unpacks, so the browser's native anchor scroll fires before #research
    // exists and lands at the top. Poll for the target, then scroll to it.
    (function () {
      function scrollToHash() {
        if (!location.hash || location.hash.length < 2) return;
        var id = decodeURIComponent(location.hash.slice(1));
        var tries = 0;
        (function attempt() {
          var el = document.getElementById(id);
          if (el) {
            var y = el.getBoundingClientRect().top + window.pageYOffset - 12;
            window.scrollTo(0, y);
          } else if (tries++ < 80) {
            setTimeout(attempt, 50);
          }
        })();
      }
      window.addEventListener('hashchange', scrollToHash);
      setTimeout(scrollToHash, 0);
    })();
  </script>

  <script>
    // ─── Tweaks wiring (host integration) ─────────────────────────────
    (function() {
      const t = window.__ACT_TWEAKS__;
      const applyAll = () => {
        document.body.dataset.variant = t.variant;
        document.body.dataset.accent = t.accent;
        document.body.dataset.density = t.density;
      };
      applyAll();

      const panel = document.getElementById('tweaks-panel');
      const refreshChips = () => {
        panel.querySelectorAll('.tweak-options').forEach(group => {
          const key = group.dataset.key;
          group.querySelectorAll('.tweak-chip').forEach(chip => {
            chip.classList.toggle('is-on', chip.dataset.val === t[key]);
          });
        });
      };
      refreshChips();

      panel.addEventListener('click', (e) => {
        const chip = e.target.closest('.tweak-chip');
        if (!chip) return;
        const group = chip.closest('.tweak-options');
        const key = group.dataset.key;
        const val = chip.dataset.val;
        t[key] = val;
        applyAll();
        refreshChips();
        window.parent.postMessage({ type: '__edit_mode_set_keys', edits: { [key]: val } }, '*');
      });

      document.getElementById('tweaks-close').addEventListener('click', () => {
        panel.classList.remove('is-open');
        window.parent.postMessage({ type: '__edit_mode_deactivated' }, '*');
      });

      // Listener FIRST, then announce
      window.addEventListener('message', (e) => {
        if (!e.data || typeof e.data !== 'object') return;
        if (e.data.type === '__activate_edit_mode') {
          panel.classList.add('is-open');
        } else if (e.data.type === '__deactivate_edit_mode') {
          panel.classList.remove('is-open');
        }
      });
      window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    })();
  </script>
